<h2 mat-dialog-title>{{ isEdit ? 'Редактировать лид' : 'Новый лид' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Полное имя *</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input matInput formControlName="fullName" placeholder="Арман Сейтказы" />
      <mat-error *ngIf="form.get('fullName')?.hasError('required')">Обязательное поле</mat-error>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Телефон *</mat-label>
        <mat-icon matPrefix>phone</mat-icon>
        <input matInput formControlName="phone" placeholder="+7 700 000 0000" />
        <mat-error *ngIf="form.get('phone')?.hasError('required')">Обязательное поле</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input matInput formControlName="email" type="email" placeholder="client@example.com" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Источник</mat-label>
        <mat-select formControlName="source">
          <mat-option *ngFor="let s of sourceOptions" [value]="s.value">{{ s.label }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Статус</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Интересующий курс</mat-label>
      <mat-icon matPrefix>school</mat-icon>
      <mat-select formControlName="interestedCourseId">
        <mat-option [value]="null">— Не выбрано —</mat-option>
        <mat-option *ngFor="let c of courses" [value]="c.id">{{ c.title }}</mat-option>
      </mat-select>
      <mat-hint *ngIf="loadingOptions">Загрузка курсов...</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Заметки</mat-label>
      <textarea matInput formControlName="notes" rows="3" placeholder="Дополнительная информация..."></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Отмена</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid || loading">
    <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block; margin-right:4px"></mat-spinner>
    {{ loading ? 'Сохранение...' : (isEdit ? 'Сохранить' : 'Добавить') }}
  </button>
</mat-dialog-actions>

<style>
  .dialog-form { display: flex; flex-direction: column; gap: 2px; min-width: 480px; }
  .full-width   { width: 100%; }
  .form-row     { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
</style>
