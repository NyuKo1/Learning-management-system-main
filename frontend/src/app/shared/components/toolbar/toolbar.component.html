<mat-toolbar color="primary">
    <mat-toolbar-row class="mat-elevation-z8 h-20 md:h-28 transition-all">
        <a routerLink="/" class="flex items-center justify-center h-full w-full p-2">
            <img
                    src="assets/logo.png"
                    alt="Logo"
                    class="max-h-full w-auto object-contain"
            />
        </a>
    </mat-toolbar-row>
  <mat-toolbar-row>
    <div class="flex flex-wrap justify-center items-center w-full gap-2">
      <a mat-button routerLink="/about" class="md:text-lg">О системе</a>
      <a mat-button routerLink="/faculties" class="md:text-lg">Направления</a>
      <a mat-button routerLink="/courses" class="md:text-lg">Курсы</a>
      <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle dark mode" class="ml-4">
          <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <a
        *ngIf="authService.validateRoles(['ROLE_STUDENT'], 'any')"
        mat-button
        routerLink="/student-services/my-courses"
        class="md:text-lg"
      >
        Мои курсы
      </a>
      <a
        *ngIf="authService.validateRoles(['ROLE_STUDENT'], 'any')"
        mat-button
        routerLink="/student-services"
        class="md:text-lg"
      >
        Учебный портал
      </a>
      <a
        *ngIf="authService.validateRoles(['ROLE_TEACHER'], 'any')"
        mat-button
        routerLink="/teacher-services"
        class="md:text-lg"
      >
        Портал преподавателя
      </a>
      <a
        *ngIf="authService.validateRoles(['ROLE_ADMIN'], 'any')"
        mat-button
        routerLink="/admin-panel"
        class="md:text-lg"
        >Панель администратора</a
      >
      <a
        *ngIf="!authService.loggedIn()"
        routerLink="/auth/login"
        mat-button
        class="md:text-lg"
      >
        Войти
      </a>
      <a
        *ngIf="authService.loggedIn()"
        (click)="authService.logout()"
        mat-button
        class="md:text-lg"
      >
        Выйти
      </a>
    </div>
  </mat-toolbar-row>
</mat-toolbar>
