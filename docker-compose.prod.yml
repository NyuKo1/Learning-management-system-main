# SEC Production stack — full SmartEduControl ecosystem.
# Startup order: databases → config-server → discovery-server → microservices → frontends
# Quick start (databases only):
#   docker-compose -f docker-compose.prod.yml up -d database-auth database-faculty database-subject database-exam database-crm

services:
  # ── Databases ────────────────────────────────────────────────────────
  database-auth:
    image: mysql:8.0.30-debian
    ports:
      - 3307:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 20s
      retries: 8
      start_period: 30s
      timeout: 10s
    volumes:
      - auth-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lms-auth
    restart: unless-stopped

  database-faculty:
    image: mysql:8.0.30-debian
    ports:
      - 3308:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 20s
      retries: 8
      start_period: 30s
      timeout: 10s
    volumes:
      - faculty-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lms-faculty
    restart: unless-stopped

  database-subject:
    image: mysql:8.0.30-debian
    ports:
      - 3309:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 20s
      retries: 8
      start_period: 30s
      timeout: 10s
    volumes:
      - subject-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lms-subject
    restart: unless-stopped

  database-exam:
    image: mysql:8.0.30-debian
    ports:
      - 3310:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 20s
      retries: 8
      start_period: 30s
      timeout: 10s
    volumes:
      - exam-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lms-exam
    restart: unless-stopped

  database-crm:
    image: mysql:8.0.30-debian
    ports:
      - 3311:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 20s
      retries: 8
      start_period: 30s
      timeout: 10s
    volumes:
      - crm-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lms-crm
    restart: unless-stopped

  database-notify:
    image: mysql:8.0.30-debian
    ports:
      - 3312:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 20s
      retries: 8
      start_period: 30s
      timeout: 10s
    volumes:
      - notify-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lms-notify
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
      timeout: 5s
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ── Spring Cloud Infrastructure ───────────────────────────────────────
  backend-config-server:
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile
    ports:
      - 8888:8888
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8888/actuator/health/' || exit 1
      interval: 20s
      retries: 8
      start_period: 40s
      timeout: 10s
    environment:
      SPRING_PROFILES_ACTIVE: prod, native
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  backend-discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    ports:
      - 8761:8761
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8761/actuator/health/' || exit 1
      interval: 20s
      retries: 8
      start_period: 40s
      timeout: 10s
    depends_on:
      backend-config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped

  backend-api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8080/actuator/health/' || exit 1
      interval: 20s
      retries: 8
      start_period: 60s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  # ── Microservices ─────────────────────────────────────────────────────
  backend-auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - 8081:8081
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8081/actuator/health/' || exit 1
      interval: 30s
      retries: 5
      start_period: 90s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
      database-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-7200}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400}
      SSO_ALLOWED_ORIGINS: ${SSO_ALLOWED_ORIGINS}
      SSO_LMS_SECRET: ${SSO_LMS_SECRET}
      SSO_LMS_REDIRECT_URI: ${SSO_LMS_REDIRECT_URI:-http://localhost:4200/auth/sso}
      SSO_LMS_ORIGIN: ${SSO_LMS_ORIGIN:-http://localhost:4200}
      SSO_CRM_SECRET: ${SSO_CRM_SECRET}
      SSO_CRM_REDIRECT_URI: ${SSO_CRM_REDIRECT_URI:-http://localhost:4201/sso/callback}
      SSO_CRM_ORIGIN: ${SSO_CRM_ORIGIN:-http://localhost:4201}
      SSO_MOBILE_SECRET: ${SSO_MOBILE_SECRET}
    restart: unless-stopped

  backend-faculty-service:
    build:
      context: ./backend
      dockerfile: faculty-service/Dockerfile
    ports:
      - 8082:8082
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8082/actuator/health/' || exit 1
      interval: 30s
      retries: 5
      start_period: 90s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
      database-faculty:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  backend-subject-service:
    build:
      context: ./backend
      dockerfile: subject-service/Dockerfile
    ports:
      - 8083:8083
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8083/actuator/health/' || exit 1
      interval: 30s
      retries: 5
      start_period: 90s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
      database-subject:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  backend-exam-service:
    build:
      context: ./backend
      dockerfile: exam-service/Dockerfile
    ports:
      - 8084:8084
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8084/actuator/health/' || exit 1
      interval: 30s
      retries: 5
      start_period: 90s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
      database-exam:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  backend-crm-service:
    build:
      context: ./backend
      dockerfile: crm-service/Dockerfile
    ports:
      - 8085:8085
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8085/actuator/health/' || exit 1
      interval: 30s
      retries: 5
      start_period: 90s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
      database-crm:
        condition: service_healthy
      backend-subject-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  backend-notify-service:
    build:
      context: ./backend
      dockerfile: notify-service/Dockerfile
    ports:
      - 8086:8086
    healthcheck:
      test: wget --spider --quiet 'http://localhost:8086/actuator/health/' || exit 1
      interval: 30s
      retries: 5
      start_period: 90s
      timeout: 10s
    depends_on:
      backend-discovery-server:
        condition: service_healthy
      database-notify:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  # ── Frontends ─────────────────────────────────────────────────────────
  frontend-landing:
    build:
      context: ./sec-landing
      dockerfile: Dockerfile
    ports:
      - ${LANDING_PORT:-80}:80
    restart: unless-stopped

  frontend-lms:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 4200:80
    depends_on:
      backend-api-gateway:
        condition: service_healthy
    restart: unless-stopped

  frontend-crm:
    build:
      context: ./crm-frontend
      dockerfile: Dockerfile
    ports:
      - 4201:80
    depends_on:
      backend-api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auth-data:
  faculty-data:
  subject-data:
  exam-data:
  crm-data:
  notify-data:
  redis-data:
