server:
  port: 8081

spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3307/lms-auth?createDatabaseIfNotExist=true
    username: root
    password: root
  jackson:
    default-property-inclusion: non_empty
  redis:
    host: localhost
    port: 6379
    timeout: 2000

springdoc:
  api-docs:
    path: /docs

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

token:
  secret: ${JWT_SECRET:GieJX^>%Pd;Z]#&?kmZY4SRZNlWsjr%JJiH!q9KM~,Zd./[oh*=dus&p_M3Ab#B}
  accessExpiration: ${JWT_ACCESS_EXPIRATION:7200}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:86400}

sso:
  code-ttl-minutes: 10
  allowed-origins: ${SSO_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:4200,http://localhost:4201}
  allowed-clients:
    - client-id: crm
      client-secret: ${SSO_CRM_SECRET:crm-secret-change-in-prod}
      redirect-uris:
        - ${SSO_CRM_REDIRECT_URI:http://localhost:4201/sso/callback}
        - http://localhost:3000/sso/callback
    - client-id: lms
      client-secret: ${SSO_LMS_SECRET:lms-secret-change-in-prod}
      redirect-uris:
        - ${SSO_LMS_REDIRECT_URI:http://localhost:4200/auth/sso/callback}
    - client-id: lms-mobile
      client-secret: ${SSO_MOBILE_SECRET:mobile-secret-change-in-prod}
      redirect-uris:
        - myapp://sso/callback

management:
  endpoints:
    web:
      exposure:
        include: "*"
